<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Art Kings Academy : BJJ, Judo, MMA, Lutte, Kickboxing, Boxe, Cross Training et Aérobic. Planning, coachs et test d'orientation.">
<link rel="icon" href="media/logo.png">
<title>The Art Kings Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Cairo:wght@400;600;700;900&display=swap">
<style>
/* Layout: fixed nav → 3D octagon hero → discipline "reels" (video + coach cutout, autoplay on view) → women → kids → interactive planning → quiz → animated location. Committed dark "black mat" look. */
:root{
  --bg:#0a0a0b; --surface:#141416; --surface2:#1c1c1f; --line:#2b2b30; --ink:#f3f1ee; --muted:#9b9aa3; --red:#e3261c; --red2:#ff4b3e;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --brand:"Anton","Impact","Arial Narrow Bold",sans-serif; --dw:400;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden}
img,video{max-width:100%;display:block}
a{color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
.lab{font-family:var(--label);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--red2)}
h2.big{font-family:var(--display);font-weight:var(--dw);font-size:clamp(44px,8vw,104px);line-height:.9;margin:6px 0 0;text-transform:uppercase;text-wrap:balance;letter-spacing:.01em}
.sub{color:var(--muted);max-width:58ch;margin:14px 0 0}
section{scroll-margin-top:70px}
:focus-visible{outline:3px solid var(--red2);outline-offset:3px}

/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.nav .in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px}
.brand img{width:38px;height:38px;border-radius:50%}
.links{display:flex;gap:22px;font-family:var(--label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--ink)}
.cta{font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;background:var(--red);color:#fff;padding:10px 16px;border-radius:3px;text-decoration:none;white-space:nowrap}
.cta:hover{background:var(--red2)}
@media (max-width:900px){.links{display:none}}
@media (max-width:440px){.brand span{display:none}}

/* hero */
.hero{position:relative;height:clamp(560px,86vh,820px);overflow:hidden;background:radial-gradient(ellipse at 50% 70%,#2a0b09 0%,var(--bg) 62%)}
#octa{position:absolute;inset:0;width:100%;height:100%}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding-bottom:44px;pointer-events:none}
.hero h1{font-family:var(--display);font-weight:var(--dw);text-transform:uppercase;margin:0;line-height:.86;font-size:clamp(58px,13vw,176px);letter-spacing:.005em}
.hero h1 .o{color:transparent;-webkit-text-stroke:2px var(--ink)}
.hero h1 .r{color:var(--red)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-top:18px}
.hero p{margin:0;color:#d6d3cf;max-width:44ch;font-size:18px}
.hero .btns{display:flex;gap:10px;flex-wrap:wrap;pointer-events:auto}
.ghost{font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;border:1.5px solid var(--ink);padding:10px 16px;border-radius:3px;text-decoration:none}
.ghost:hover{background:var(--ink);color:var(--bg)}

/* ticker */
.ticker{border-block:1px solid var(--line);overflow:hidden;background:var(--red);color:#fff}
.ticker .t{display:flex;gap:40px;width:max-content;padding:12px 0;font-size:26px;text-transform:uppercase;animation:tick 32s linear infinite}
.ticker .t span::after{content:"✕";margin-left:40px;font-size:16px;vertical-align:middle;opacity:.7}
@keyframes tick{to{transform:translateX(-50%)}}

/* mats intro */
.mats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px}
.mat{position:relative;border-radius:4px;padding:26px;min-height:200px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-decoration:none}
.mat.w{background:#ecebe8;color:#0c0c0d}
.mat.b{background:#000;border:1px solid var(--line)}
.mat h3{font-family:var(--display);font-weight:var(--dw);font-size:clamp(40px,6vw,64px);line-height:.9;margin:0;text-transform:uppercase}
.mat h3 span{color:transparent;-webkit-text-stroke:1.5px currentColor}
.mat.w h3 span{-webkit-text-stroke-color:#0c0c0d}
.mat.b h3 span{-webkit-text-stroke-color:var(--ink)}
.mat .k{font-family:var(--label);letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-size:13px;opacity:.75}
.mat .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mat .pills b{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.06em;padding:4px 9px;border-radius:2px;border:1px solid currentColor;opacity:.85}
.mat::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 79px,currentColor 79px 80px);opacity:.06}
@media (max-width:700px){.mats{grid-template-columns:1fr}}

/* discipline reels */
.disc{position:relative;padding-block:84px;border-top:1px solid var(--line);overflow:hidden}
.disc .ghostword{position:absolute;top:28px;inset-inline-end:-10px;font-family:var(--display);text-transform:uppercase;font-size:clamp(90px,18vw,250px);line-height:.8;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--ink) 13%,transparent);white-space:nowrap;pointer-events:none;user-select:none}
.disc .grid{position:relative;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:34px;align-items:center}
.disc .head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.disc h2{font-family:var(--display);font-weight:var(--dw);font-size:clamp(44px,7vw,92px);text-transform:uppercase;line-height:.9;margin:4px 0 0}
.tagl{font-family:var(--label);font-size:20px;font-weight:600;color:var(--muted)}
.matbadge{font-family:var(--label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding:6px 10px;border-radius:2px}
.matbadge.white{background:#ecebe8;color:#0c0c0d}
.matbadge.black{background:#000;color:var(--ink);border:1px solid #444}
.vframe{position:relative;border-radius:4px;overflow:hidden;background:#000;box-shadow:0 30px 80px -30px rgba(227,38,28,.45);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.vframe video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.vframe.v video{aspect-ratio:9/16}
.vframe .live{position:absolute;top:12px;left:12px;font-family:var(--label);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase;background:rgba(0,0,0,.6);padding:5px 9px;border-radius:2px;display:flex;align-items:center;gap:7px}
.vframe .live i{width:8px;height:8px;border-radius:50%;background:var(--red2);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.snd{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;cursor:pointer}
.snd:hover{background:var(--red)}
.snd svg{width:20px;height:20px}
.coachcol{position:relative;display:flex;flex-direction:column;gap:16px}
.coach{position:relative;perspective:900px;height:clamp(300px,36vw,460px)}
.coach .ring{position:absolute;left:50%;bottom:0;width:86%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 55%,transparent),transparent 66%)}
.coach img{position:absolute;left:50%;bottom:0;height:100%;width:auto;max-width:none;transform:translateX(-50%) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transform-origin:50% 100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.7));transition:transform .25s ease-out}
.coach .floor{position:absolute;left:8%;right:8%;bottom:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
.cname{display:flex;flex-direction:column;gap:2px;min-width:0}
.cname b{overflow-wrap:anywhere}
.cname small{font-family:var(--label);letter-spacing:.16em;text-transform:uppercase;font-weight:600;font-size:12px;color:var(--muted)}
.cname b{font-family:var(--display);font-weight:var(--dw);font-size:40px;line-height:1;text-transform:uppercase}
.desc{color:#cfccc8;margin:0;max-width:54ch}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.03em;padding:6px 10px;border-radius:2px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums;max-width:100%}
.slot em{font-style:normal;color:var(--c);margin-right:6px}
.disc .info{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:34px;align-items:start}
@media (max-width:860px){
 .disc .grid,.disc .info{grid-template-columns:minmax(0,1fr);gap:20px}
 .disc h2{overflow-wrap:anywhere}
 .coachcol{flex-direction:row;align-items:flex-end;gap:12px}
 .coach{height:260px;flex:0 0 52%}
}

/* reveal (only applied to elements below the fold at load) */
.pre{opacity:0;transform:translateY(40px)}
.rv{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.coach.pre img{transform:translateX(-50%) translateY(60px) rotateY(-25deg)}

/* women & kids */
.band{padding-block:90px;border-top:1px solid var(--line)}
.women{background:linear-gradient(180deg,#160810,var(--bg) 70%)}
.reelrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:22px;margin-top:40px;align-items:start}
.reel{display:flex;flex-direction:column;gap:12px}
.reel .vframe{border-radius:18px;border:6px solid #1d1d20;max-width:320px}
.reel h3{font-family:var(--display);font-weight:var(--dw);font-size:30px;text-transform:uppercase;margin:0;line-height:1}
.mono{position:relative;width:min(100%,300px);aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:#0e0e10;display:grid;place-items:center;border:1px solid var(--line)}
.mono .sweep{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,#ff2bc2 80%,var(--red2) 88%,transparent 95%);animation:spin 6s linear infinite;opacity:.55}
.mono::after{content:"";position:absolute;inset:3px;background:#0e0e10;border-radius:3px}
.mono span{position:relative;z-index:2;font-family:var(--display);font-size:200px;line-height:1;color:transparent;-webkit-text-stroke:2px #ff5ad7;animation:breathe 4s ease-in-out infinite}
.mono small{position:absolute;z-index:2;bottom:18px;font-family:var(--label);letter-spacing:.2em;text-transform:uppercase;font-weight:700;font-size:13px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.06);-webkit-text-stroke-color:var(--red2)}}
.kids{background:linear-gradient(180deg,#0b1012,var(--bg) 70%)}
.kidtable{display:grid;gap:8px;margin-top:6px}
.kidtable div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.kidtable b{font-family:var(--display);font-weight:var(--dw);font-size:24px}
.kidtable span{color:#cfccc8;font-variant-numeric:tabular-nums}

/* planning */
.plan{padding-block:90px;border-top:1px solid var(--line)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.tab{all:unset;cursor:pointer;font-family:var(--label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;padding:10px 14px;border:1.5px solid var(--line);border-radius:3px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .today{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red2);margin-left:6px;vertical-align:middle}
.filters .tab{font-size:13px;padding:7px 11px}
.sessions{display:grid;gap:8px;margin-top:22px}
.sess{display:grid;grid-template-columns:120px 6px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:3px}
.sess .tm{font-family:var(--label);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.sess .bar{height:100%;min-height:34px;border-radius:2px;background:var(--c)}
.sess .nm{font-weight:600}
.sess .nm small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.empty{color:var(--muted);padding:24px 0}
@media (max-width:600px){.sess{grid-template-columns:auto 5px minmax(0,1fr);gap:12px}.sess .matbadge{grid-column:3}}

/* quiz */
.quiz{padding-block:90px;border-top:1px solid var(--line);background:radial-gradient(ellipse at 80% 0%,#220807,var(--bg) 55%)}
.qcard{margin-top:34px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:clamp(18px,4vw,36px);display:flex;flex-direction:column;gap:20px;max-width:820px}
.belt{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.belt span{height:8px;border-radius:1px;background:var(--line)}
.qn{font-family:var(--label);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.qcard h3{font-family:var(--display);font-weight:var(--dw);font-size:clamp(30px,5vw,48px);line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:3px;background:var(--surface2);font-weight:500;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--ink);transform:translateY(-2px)}
.opt[aria-pressed="true"]{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--surface2))}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--label);font-weight:700;color:var(--muted)}
.opt[aria-pressed="true"] .k{background:var(--red);border-color:var(--red);color:#fff}
.qnav{display:flex;justify-content:space-between;gap:10px}
.btn{all:unset;cursor:pointer;font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;padding:11px 18px;border-radius:3px;border:1.5px solid var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.result{margin-top:34px;display:grid;gap:22px}
.rtop{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:clamp(16px,3vw,30px)}
.rtop h3{font-family:var(--display);font-weight:var(--dw);font-size:clamp(46px,8vw,96px);line-height:.88;margin:4px 0 8px;text-transform:uppercase}
.pct{font-family:var(--label);font-weight:700;font-size:18px;color:var(--red2);letter-spacing:.06em}
.rside{display:flex;flex-direction:column;gap:14px}
.rside .coach{height:300px}
.rtop .vframe.v{max-width:360px}
.others{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.oth{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.oth b{font-family:var(--display);font-weight:var(--dw);font-size:24px;text-transform:uppercase}
.oth span{font-family:var(--label);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:860px){.rtop .vframe.v{max-width:300px}.rtop{grid-template-columns:minmax(0,1fr)}.rside .coach{height:240px}}

/* location */
.loc{padding-block:90px;border-top:1px solid var(--line)}
.locgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px;align-items:center;margin-top:34px}
.radar{position:relative;aspect-ratio:1;max-width:520px;width:100%;border-radius:50%;background:radial-gradient(circle,#1a0c0b,#0b0b0c 70%);border:1px solid var(--line);overflow:hidden}
.radar svg{position:absolute;inset:0;width:100%;height:100%}
.radar .streets path{fill:none;stroke:#3a3a40;stroke-width:1.2;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 3s ease forwards}
.radar .scan{position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 82%,rgba(227,38,28,.35) 100%);animation:spin 5s linear infinite;border-radius:50%}
.radar .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%)}
.radar .pin svg{position:static;width:46px;height:46px;animation:drop 1.2s cubic-bezier(.3,1.6,.5,1) both .6s}
.radar .wave{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:2px solid var(--red2);animation:wave 2.4s ease-out infinite}
.radar .wave:nth-child(2){animation-delay:.8s}.radar .wave:nth-child(3){animation-delay:1.6s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes drop{from{transform:translateY(-120px);opacity:0}}
@keyframes wave{to{transform:scale(14);opacity:0}}
.hours{display:grid;gap:4px;margin:20px 0 26px}
.hours div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hours b{font-family:var(--label);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:860px){.locgrid{grid-template-columns:1fr}}

footer{border-top:1px solid var(--line);padding-block:40px calc(40px + env(safe-area-inset-bottom,0px));color:var(--muted)}
footer .in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer .motto{font-family:var(--display);font-weight:var(--dw);font-size:28px;text-transform:uppercase;color:var(--ink)}


/* language toggle + Arabic / RTL */
.navr{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1.5px solid var(--line);border-radius:3px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:9px 11px;font-family:var(--label);font-weight:700;font-size:14px;line-height:1;color:var(--muted)}
.lang button[lang="ar"]{font-family:"Cairo",sans-serif;font-size:15px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline:3px solid var(--red2);outline-offset:-3px}
.hero h1,.mat h3,.ghostword,.ticker .t,.mono span{font-family:var(--brand)!important;font-weight:400!important}
.ticker{direction:ltr}
.tm,bdi{unicode-bidi:isolate}
.live b{font-weight:inherit}
html[lang="ar"]{--display:"Cairo",sans-serif;--body:"Cairo",system-ui,sans-serif;--label:"Cairo",sans-serif;--dw:900}
html[lang="ar"] body{font-size:17px}
html[lang="ar"] *{letter-spacing:0!important}
html[lang="ar"] h2.big{font-size:clamp(34px,7vw,88px)}
h2.big,.nm,.kidtable span,.kidtable b{overflow-wrap:anywhere;min-width:0}
html[lang="ar"] h2.big,html[lang="ar"] .disc h2,html[lang="ar"] .qcard h3,html[lang="ar"] .rtop h3{line-height:1.2}
html[lang="ar"] .cname b,html[lang="ar"] .reel h3,html[lang="ar"] .oth b,html[lang="ar"] footer .motto{line-height:1.3}
html[lang="ar"] .hero .copy .lab,html[lang="ar"] .lab{font-size:14px}
@media (max-width:440px){.nav .cta{padding:9px 11px;font-size:13px}}
.rtop>*,.rside>*{min-width:0}
.hero .btns .cta,.hero .btns .ghost,.result .cta{white-space:normal}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ticker .t{transform:none}.radar .streets path{stroke-dashoffset:0}}
</style>
<style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>

/* video: autoplay muted when in view, pause when out */
const vio=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting&&e.intersectionRatio>=.45){v.play().catch(()=>{})}else{v.pause()}}),{threshold:[0,.45,.8]});
function wireVideos(){
  vio.disconnect();
  document.querySelectorAll("video.auto").forEach(v=>{
    const f=v.parentElement;let b=f.querySelector(".snd");
    if(!b){b=document.createElement("button");b.className="snd";b.innerHTML=ICON_OFF;f.appendChild(b);
      b.onclick=()=>{const on=v.muted;document.querySelectorAll("video").forEach(o=>{o.muted=true;const sb=o.parentElement.querySelector(".snd");if(sb)sb.innerHTML=ICON_OFF});
        v.muted=!on;b.innerHTML=on?ICON_ON:ICON_OFF;if(on)v.play().catch(()=>{})}}
    b.setAttribute("aria-label",t("sound"));vio.observe(v)});
}

let qi=0;const ans={};
const vis=()=>Q.filter(q=>!q.show||q.show(ctx));
function eligible(){if(ctx.who==="k"){return {k1:["judok"],k2:["judok","kickk"],k3:["judok","bjjk","kickk"]}[ctx.age]||["judok","bjjk","kickk"]}
  return ctx.who==="f"?["bjjw","judo","mma","wrest","kick","box","cross","aero"]:["bjj","judo","mma","wrest","kick","box","cross"]}
function mapKey(k){if(ctx.who==="k")return KIDMAP[k];if(ctx.who==="f"&&k==="bjj")return "bjjw";return k}
const qText=q=>L(typeof q.q==="function"?q.q(ctx):q.q);
function drawQuiz(){
  const qs=vis();const box=document.getElementById("quiz");
  if(qi>=qs.length)return result();
  const q=qs[qi];const opts=q.o(ctx);
  box.innerHTML=`<div class="qcard"><div class="belt">${qs.map((_,i)=>`<span style="${i<=qi?`background:${["#f3f1ee","#f2c230","#ef7d1a","#2f9e44","#1c6dd0","#7b3fb5","#7a4a26","#e3261c"][i%8]}`:""}"></span>`).join("")}</div>
   <div class="qn">${t("qn")(qi+1,qs.length)}</div><h3>${qText(q)}</h3>
   <div class="opts">${opts.map((o,n)=>`<button class="opt" id="q-${q.id}-${n}" aria-pressed="${ans[q.id]===n}" data-n="${n}"><span class="k">${lang==="ar"?"أبجدهوز"[n]:String.fromCharCode(65+n)}</span><span>${L(o[0])}</span></button>`).join("")}</div>
   <div class="qnav"><button class="btn" id="qback" ${qi===0?"disabled":""}>${t("back")}</button><span class="qn" style="align-self:center">${t("pick")}</span></div></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;ans[q.id]=n;const o=opts[n];
    if(q.id==="who"){if(ctx.who!==o[2]){delete ans.age;delete ans.goal;delete ans.style;delete ans.vibe}ctx.who=o[2]}
    if(q.id==="age"&&o[2])ctx.age=o[2];
    box.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));setTimeout(()=>{qi++;drawQuiz()},200)});
  document.getElementById("qback").onclick=()=>{if(qi>0){qi--;drawQuiz()}};
}
function result(){
  const el=eligible(),sc={},mx={};el.forEach(k=>{sc[k]=0;mx[k]=0});
  vis().forEach(q=>{const opts=q.o(ctx);
    const per=opts.map(o=>{const m={};for(const k in o[1]){const mk=mapKey(k);if(mk in sc)m[mk]=Math.max(m[mk]||0,o[1][k])}return m});
    el.forEach(k=>{mx[k]+=Math.max(0,...per.map(m=>m[k]||0))});
    if(ans[q.id]!=null){const m=per[ans[q.id]];for(const k in m)sc[k]+=m[k]}});
  const r=el.map(k=>({k,p:mx[k]?Math.round(sc[k]/mx[k]*100):100})).sort((a,b)=>b.p-a.p);
  const w=P[r[0].k];
  document.getElementById("quiz").innerHTML=`<div class="result" style="--c:${w.c}">
   <div class="rtop">
     <div>${videoHTML(w)}</div>
     <div class="rside">
       <div><div class="lab">${ctx.who==="k"?t("rLabK"):t("rLab")}</div><h3>${L(w.name)}</h3><div class="pct"><bdi dir="ltr">${r[0].p}%</bdi> ${t("match")} · ${L(w.tag)}</div></div>
       <div class="coach tilt" style="--c:${w.c}">${coachHTML(w)}</div>
       <div class="cname"><small>${C[w.coach].f?t("yourCoachF"):t("yourCoach")}</small><b>${L(C[w.coach])}</b></div>
     </div>
     <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:12px"><p class="desc">${L(w.desc)}</p><div class="slots">${slotHTML(r[0].k)}</div></div>
   </div>
   ${r.length>1?`<div><div class="lab" style="margin-bottom:10px">${t("others")}</div><div class="others">${r.slice(1,3).map(x=>`<div class="oth"><b>${L(P[x.k].name)}</b><span><bdi dir="ltr">${x.p}%</bdi></span></div>`).join("")}</div></div>`:""}
   <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="cta" href="https://www.instagram.com/theartkingsacademy/" target="_blank" rel="noopener">${t("book")}</a><button class="btn" id="qagain">${t("again")}</button></div>
  </div>`;
  wireVideos();document.querySelectorAll("#quiz video.auto").forEach(v=>v.play().catch(()=>{}));
  document.getElementById("qagain").onclick=()=>{for(const k in ans)delete ans[k];for(const k in ctx)delete ctx[k];qi=0;drawQuiz();document.getElementById("test").scrollIntoView()};
}

  if(!window.THREE)return;
  const cv=document.getElementById("octa");let W=cv.clientWidth,H=cv.clientHeight;
  const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,1.6));R.setSize(W,H,false);
  const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0a0a0b,14,34);
  const cam=new THREE.PerspectiveCamera(42,W/H,.1,100);
  const g=new THREE.Group();scene.add(g);
  const rad=6,n=8,post=[];for(let i=0;i<n;i++){const a=i*Math.PI/4+Math.PI/8;post.push(new THREE.Vector3(Math.cos(a)*rad,0,Math.sin(a)*rad))}
  const metal=new THREE.MeshStandardMaterial({color:0x2a2a2e,metalness:.8,roughness:.35});
  const redm=new THREE.MeshStandardMaterial({color:0xe3261c,emissive:0x5a0905,metalness:.3,roughness:.5});
  post.forEach(p=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,3.1,10),metal);c.position.set(p.x,1.55,p.z);g.add(c);
    const pad=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.9,10),redm);pad.position.set(p.x,2.3,p.z);g.add(pad)});
  const fence=[],h0=.25,h1=3;
  for(let i=0;i<n;i++){const a=post[i],b=post[(i+1)%n];
    const rail=(y)=>{const d=a.distanceTo(b);const m=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,d,8),y>2?redm:metal);m.position.set((a.x+b.x)/2,y,(a.z+b.z)/2);m.lookAt(b.x,y,b.z);m.rotateX(Math.PI/2);g.add(m)};
    rail(h1);rail(h0);
    const L=(u,y)=>new THREE.Vector3(a.x+(b.x-a.x)*u,y,a.z+(b.z-a.z)*u);
    const k=12,slope=.4;
    for(let j=-k;j<=k;j++){const ua=j/k;[1,-1].forEach(s=>{const du=s*slope;
      let t0=du>0?(0-ua)/du:(1-ua)/du,t1=du>0?(1-ua)/du:(0-ua)/du;t0=Math.max(0,t0);t1=Math.min(1,t1);
      if(t1-t0>.03)fence.push(L(ua+du*t0,h0+(h1-h0)*t0),L(ua+du*t1,h0+(h1-h0)*t1))})}}
  const fg=new THREE.BufferGeometry().setFromPoints(fence);
  g.add(new THREE.LineSegments(fg,new THREE.LineBasicMaterial({color:0x8a8a92,transparent:true,opacity:.28})));
  const floor=new THREE.Mesh(new THREE.CircleGeometry(rad*1.08,8),new THREE.MeshStandardMaterial({color:0x111113,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.rotation.z=Math.PI/8;g.add(floor);
  const ol=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(post.map(p=>new THREE.Vector3(p.x*.9,.02,p.z*.9))),new THREE.LineBasicMaterial({color:0xe3261c}));g.add(ol);
  new THREE.TextureLoader().load("media/logo.png",t=>{const m=new THREE.Mesh(new THREE.CircleGeometry(1.8,48),new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:.92}));m.rotation.x=-Math.PI/2;m.position.y=.03;g.add(m)});
  const pc=700,pp=new Float32Array(pc*3);for(let i=0;i<pc;i++){pp[i*3]=(Math.random()-.5)*30;pp[i*3+1]=Math.random()*12;pp[i*3+2]=(Math.random()-.5)*30}
  const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pp,3));
  const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xff6a5a,size:.05,transparent:true,opacity:.7}));scene.add(pts);
  scene.add(new THREE.AmbientLight(0xffffff,.35));
  const sp=new THREE.SpotLight(0xffffff,1.4,40,Math.PI/5,.5);sp.position.set(0,14,0);scene.add(sp);
  const rl=new THREE.PointLight(0xe3261c,2.2,30);rl.position.set(-8,4,6);scene.add(rl);
  let mx=0,my=0,vis=true,t=0;
  addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  new IntersectionObserver(es=>{vis=es[0].isIntersecting}).observe(cv);
  function size(){W=cv.clientWidth;H=cv.clientHeight;R.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix()}
  addEventListener("resize",size);
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(){if(vis){t+=.003;g.rotation.y=still?.4:t;
    const P=pg.attributes.position.array;if(!still)for(let i=1;i<P.length;i+=3){P[i]+=.008;if(P[i]>12)P[i]=0}pg.attributes.position.needsUpdate=true;
    const far=W<700?17:13.5;cam.position.set(Math.sin(mx*.6)*far,6.5-my*2,Math.cos(mx*.6)*far);cam.lookAt(0,W<700?2.2:1.2,0);R.render(scene,cam)}
    if(!still)requestAnimationFrame(frame)}
  size();frame();if(still)R.render(scene,cam);
})();
</script>
